<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Verificación de de números positivos o negativos a partir de una suma</h1>
<h1>Ingrese numero 1</h1>
    <input id="input" type="text">
    <h1>Ingrese numero 2</h1>

<input id="input1" type="text">

<!--Creación del boton. Suma de ambos valores en la linea 20-->
<button onclick="
valor= document.querySelector('#input').value
valor1= document.querySelector('#input1').value
if (valor+valor1>0) {
resultado = document.querySelector('#secret-result')
resultado.innerHTML = 'Es un número positivo'
}

else {
resultado = document.querySelector('#secret-result')
resultado.innerHTML = 'Es un número negativo'
}
"> Verificar </button>
<p id="secret-result"></p>
</body>
</html>
